<!DOCTYPE html>
<html>
<head>
    <title>DegreePath - Student Lookup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
        }
        form {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 8px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <h1>DegreePath - Course Recommendation System</h1>

    <h2>Create New Student</h2>
    <form method="POST">
        {% csrf_token %}

        <label>Student ID:</label>
        <input type="text" name="student_id" required>

        <label>First Name:</label>
        <input type="text" name="first_name" required>

        <label>Last Name:</label>
        <input type="text" name="last_name" required>

        <label>Major:</label>
        <select name="major" required>
            <option value="">-- Select Major --</option>
            {% for major in majors %}
                <option value="{{ major.id }}">{{ major.name }}</option>
            {% endfor %}
        </select>

        <label>Expected Graduation (optional):</label>
        <input type="date" name="graduation_date">

        <button type="submit">Create Student & View Dashboard</button>
    </form>
</body>
</html>
